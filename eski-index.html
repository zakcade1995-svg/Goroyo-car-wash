<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOROYO CAR WASH</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090909;color:#eee;font-family:Arial}main{max-width:760px;margin:auto;padding:24px}h1,.g{color:#d9b84d}section{background:#171717;border:1px solid #555;border-radius:20px;padding:22px;margin:20px 0}input,select,button{width:100%;box-sizing:border-box;padding:16px;margin:7px 0;border-radius:12px;border:1px solid #555;background:#222;color:#eee;font-size:16px}button{background:#d9b84d;color:#111;font-weight:bold}.hide{display:none}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #333;text-align:left}.bad{color:#ff8b8b}</style></head><body><main><h1>GOROYO CAR WASH</h1><p>PROPRETÉ • QUALITÉ • ÉCLAT</p>
<section id="login"><h2>Connexion</h2><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Mot de passe"><button id="li">SE CONNECTER</button><p id="lm"></p></section>
<div id="app" class="hide"><section><h2>Aujourd'hui</h2><p>Voitures: <b class="g" id="cars">0</b><br>Chiffre d'affaires: <b class="g" id="rev">0 DJF</b></p><button id="lo">DÉCONNEXION</button></section>
<section><h2>Nouveau lavage</h2><input id="plate" placeholder="Plaque"><input id="client" placeholder="Client"><input id="phone" placeholder="Téléphone"><select id="service"><option value="Bronze" data-p="2000">Bronze — 2 000 DJF</option><option value="Silver" data-p="3500">Silver — 3 500 DJF</option><option value="Gold" data-p="5000">Gold — 5 000 DJF</option></select><input id="employee" placeholder="Employé"><button id="save">ENREGISTRER</button><p id="msg"></p></section>
<section><h2>Historique</h2><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Plaque</th><th>Service</th><th>Prix</th><th>Employé</th></tr></thead><tbody id="hist"></tbody></table></div></section></div></main>
<script>const sb=supabase.createClient("https://vrpvtquxhcquonuhrgbi.supabase.co","sb_publishable_DT1QihntiNAw_ogKUy3lZg_UJyCEFtn"),$=x=>document.getElementById(x);function show(x){$("login").classList.toggle("hide",x);$("app").classList.toggle("hide",!x)}async function refresh(){let{data,error}=await sb.from("washes").select("*").order("created_at",{ascending:false}).limit(100);if(error){$("msg").className="bad";$("msg").textContent=error.message;return}data=data||[];$("hist").innerHTML=data.map(x=>`<tr><td>${new Date(x.created_at).toLocaleDateString("fr-FR")}</td><td>${x.plate||""}</td><td>${x.service||""}</td><td>${Number(x.price||0).toLocaleString()} DJF</td><td>${x.employee||""}</td></tr>`).join("");let t=new Date().toISOString().slice(0,10),d=data.filter(x=>(x.created_at||"").slice(0,10)===t);$("cars").textContent=d.length;$("rev").textContent=d.reduce((a,x)=>a+Number(x.price||0),0).toLocaleString()+" DJF"}$("li").onclick=async()=>{let{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error){$("lm").className="bad";$("lm").textContent=error.message}else{show(true);refresh()}};$("lo").onclick=async()=>{await sb.auth.signOut();show(false)};$("save").onclick=async()=>{let o=$("service").selectedOptions[0],{error}=await sb.from("washes").insert({plate:$("plate").value.trim(),client:$("client").value.trim(),phone:$("phone").value.trim(),service:o.value,price:+o.dataset.p,employee:$("employee").value.trim()});$("msg").textContent=error?error.message:"Enregistré ✓";if(!error)refresh()};(async()=>{let{data:{session}}=await sb.auth.getSession();show(!!session);if(session)refresh()})();</script></body></html>
