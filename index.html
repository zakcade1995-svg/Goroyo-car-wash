<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOROYO CAR WASH DJIBOUTI</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;padding:20px}
h1,h2{color:#d4af37}
.card{background:#1d1d1d;padding:18px;margin:15px 0;border-radius:12px}
input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:8px;border:0;font-size:16px}
button{background:#d4af37;color:#111;font-weight:bold}
table{width:100%;border-collapse:collapse}
td,th{padding:9px;border-bottom:1px solid #444;text-align:left}
.hide{display:none}
</style>
</head>
<body>

<h1>GOROYO CAR WASH</h1>
<p>DJIBOUTI • 77 02 05 49</p>

<div id="loginBox" class="card">
<h2>Connexion</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Mot de passe">
<button id="loginBtn" type="button">Connexion</button>
<p id="msg"></p>
</div>

<div id="app" class="hide">

<div class="card">
<h2>Aujourd'hui</h2>
<div>Voitures: <b id="cars">0</b></div>
<div>Chiffre d'affaires: <b id="revenue">0 DJF</b></div>
</div>

<div class="card">
<h2>Nouveau lavage</h2>
<input id="plate" placeholder="Plaque">
<input id="client" placeholder="Client">
<input id="phone" placeholder="Téléphone">

<select id="service">
<option value="Bronze">Bronze — 2000 DJF</option>
<option value="Silver">Silver — 3500 DJF</option>
<option value="Gold">Gold — 5000 DJF</option>
</select>

<input id="employee" placeholder="Employé">

<select id="payment">
<option value="Cash">Espèces</option>
<option value="Mobile">Mobile Money</option>
<option value="Card">Carte</option>
</select>

<button id="saveBtn" type="button">Enregistrer</button>
</div>

<div class="card">
<h2>Historique</h2>
<div style="overflow:auto">
<table>
<thead>
<tr>
<th>Plaque</th>
<th>Service</th>
<th>Prix</th>
<th>Employé</th>
</tr>
</thead>
<tbody id="history"></tbody>
</table>
</div>
</div>

<button id="logoutBtn" type="button">Déconnexion</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const sb=supabase.createClient(
"https://vrpvtquxhcquonuhrgbi.supabase.co",
"sb_publishable_DT1QihntiNAw_ogKUy3lZg_UJyCEFtn"
);

const $=id=>document.getElementById(id);

const prices={
Bronze:2000,
Silver:3500,
Gold:5000
};

$("loginBtn").addEventListener("click",doLogin);
$("saveBtn").addEventListener("click",saveWash);
$("logoutBtn").addEventListener("click",logout);

async function doLogin(){

$("msg").textContent="Connexion...";

const {error}=await sb.auth.signInWithPassword({
email:$("email").value.trim(),
password:$("password").value
});

if(error){
$("msg").textContent=error.message;
return;
}

$("msg").textContent="";
await showApp();

}

async function logout(){
await sb.auth.signOut();
location.reload();
}

async function showApp(){
$("loginBox").classList.add("hide");
$("app").classList.remove("hide");
await loadWashes();
}

async function saveWash(){

const s=$("service").value;

const {error}=await sb.from("washes").insert({
plate:$("plate").value.trim(),
client:$("client").value.trim(),
phone:$("phone").value.trim(),
service:s,
price:prices[s],
employee:$("employee").value.trim(),
payment_method:$("payment").value
});

if(error){
alert(error.message);
return;
}

$("plate").value="";
$("client").value="";
$("phone").value="";
$("employee").value="";

await loadWashes();

}

async function loadWashes(){

const {data,error}=await sb
.from("washes")
.select("*")
.order("created_at",{ascending:false})
.limit(100);

if(error){
alert(error.message);
return;
}

$("history").innerHTML="";

let count=0;
let total=0;

const today=new Date().toDateString();

(data||[]).forEach(w=>{

const tr=document.createElement("tr");

[
w.plate||"",
w.service||"",
`${w.price||0} DJF`,
w.employee||""
].forEach(value=>{

const td=document.createElement("td");
td.textContent=value;
tr.appendChild(td);

});

$("history").appendChild(tr);

if(new Date(w.created_at).toDateString()===today){
count++;
total+=Number(w.price||0);
}

});

$("cars").textContent=count;
$("revenue").textContent=total.toLocaleString()+" DJF";

}

sb.auth.getSession().then(({data})=>{
if(data.session) showApp();
});

</script>
</body>
</html>
