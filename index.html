<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOROYO CAR WASH</title><style>body{font-family:Arial;background:#090909;color:#eee;margin:0}.w{max-width:850px;margin:auto;padding:18px}.c{background:#171717;padding:18px;border:1px solid #555;border-radius:14px;margin:12px 0}h1{color:#d4af37}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:8px;border:1px solid #555;background:#222;color:white}button{background:#d4af37;color:#111;font-weight:bold}.hide{display:none}.gold{color:#d4af37;font-size:24px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #444;text-align:left}</style></head><body>
<div id="login" class="w"><div class="c"><h1>GOROYO CAR WASH</h1><p>Djibouti • 77 02 05 49</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button onclick="go()">CONNEXION</button><small>PIN initial : 1234</small></div></div>
<div id="app" class="w hide"><h1>GOROYO CAR WASH</h1><p>PROPRETÉ • QUALITÉ • ÉCLAT</p><div class="c">Voitures aujourd'hui: <span class="gold" id="cars">0</span><br>Chiffre d'affaires: <span class="gold" id="rev">0 DJF</span></div>
<div class="c"><h2>Nouveau lavage</h2><input id="plate" placeholder="Plaque"><input id="client" placeholder="Client"><input id="phone" placeholder="Téléphone"><select id="service"><option value="2000">Bronze — 2 000 DJF</option><option value="3500">Silver — 3 500 DJF</option><option value="5000">Gold — 5 000 DJF</option></select><input id="employee" placeholder="Employé"><button onclick="add()">ENREGISTRER</button></div>
<div class="c"><h2>Historique</h2><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Plaque</th><th>Service</th><th>Prix</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>const K='goroyo_v3';function go(){if(pin.value==='1234'){login.classList.add('hide');app.classList.remove('hide');render()}else alert('PIN incorrect')}function get(){return JSON.parse(localStorage.getItem(K)||'[]')}function add(){let a=get(),o=service.options[service.selectedIndex];a.unshift({d:new Date().toISOString(),p:plate.value,c:client.value,t:phone.value,s:o.text.split(' — ')[0],v:+service.value,e:employee.value});localStorage.setItem(K,JSON.stringify(a));plate.value=client.value=phone.value='';render()}function render(){let a=get(),t=a.filter(x=>new Date(x.d).toDateString()===new Date().toDateString());cars.textContent=t.length;rev.textContent=t.reduce((s,x)=>s+x.v,0).toLocaleString()+' DJF';rows.innerHTML=a.map(x=>'<tr><td>'+new Date(x.d).toLocaleString('fr-FR')+'</td><td>'+x.p+'</td><td>'+x.s+'</td><td>'+x.v.toLocaleString()+'</td></tr>').join('')}</script></body></html>
